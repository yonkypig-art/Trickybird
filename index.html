<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trickybird Mirror</title>
    <style>
        /* Reset browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Full screen container wrapper */
        .wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }
        /* Complete window frame stretching */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <iframe src="https://trickybird.com/" allow="fullscreen"></iframe>
    </div>

</body>
</html>
